name: aestetik

channels:
  - conda-forge
  - pytorch

dependencies:
  - python>=3.9,<3.14
  - pip
  - pytorch>=2.0
  - torchvision>=0.15
  - lightning>=2.0
  - numpy>=1.23
  - pandas>=1.5
  - scipy>=1.10
  - anndata>=0.9
  - scanpy>=1.9
  - squidpy>=1.2
  - matplotlib>=3.7
  - scikit-learn>=1.2
  - joblib>=1.2
  - tqdm>=4.64
  # Optional: morphology helpers need libvips. Install on demand
  # via the [vips] extra (or here) if you want to extract morphology
  # features from images.
  - pyvips>=2.2
  - pip:
      - plotnine>=0.10
